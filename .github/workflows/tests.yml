name: Tests

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Compiler / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  runtime:
    name: PyTorch / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: minimum
            python-version: "3.10"
            packages: 'torch==2.4.0 torchvision==0.19.0 "numpy<2"'
          - runtime: current
            python-version: "3.13"
            packages: 'torch torchvision'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install compiler and CPU runtime
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install ${{ matrix.packages }} --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, torchvision"
      - name: Verify generated execution and optimizer equivalence
        run: python -m pytest tests/ -v --tb=short

  package:
    name: Built distribution / Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -I scripts/verify_distribution.py dist

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with Black
        run: black --check --diff aurane/ tests/ scripts/

      - name: Type check with MyPy
        run: mypy aurane/ --ignore-missing-imports
