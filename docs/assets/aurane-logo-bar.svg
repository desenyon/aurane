<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aurane logo bar</title>
  <desc id="desc">A release-ready logo bar for Aurane, a machine learning DSL that compiles to PyTorch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.43" stop-color="#102A43"/>
      <stop offset="1" stop-color="#0B3B3C"/>
    </linearGradient>
    <linearGradient id="mark" x1="134" y1="56" x2="296" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.52" stop-color="#34D399"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="line" x1="390" y1="201" x2="1016" y2="201" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#FDE68A"/>
