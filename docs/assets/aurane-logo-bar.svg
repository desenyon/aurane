  <text x="393" y="177" fill="#C7D2FE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600" letter-spacing="0">A modern ML DSL that lowers clean architecture into idiomatic PyTorch.</text>
